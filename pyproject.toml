[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-debug"
version = "1.9.0"
description = "VMware diagnostic brain — read-only incident triage, log/event correlation, and root-cause routing across the VMware skill family"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wei Zhou", email = "wei-wz.zhou@broadcom.com" }]
keywords = ["vmware", "vsphere", "debug", "troubleshooting", "diagnostics", "rca", "mcp", "ai-ops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "mcp[cli]>=1.10,<2.0",
    "vmware-policy>=1.8.5,<2.0",
    # Imported directly by ops/cases/grading.py for the rules file. It has
    # always arrived transitively via vmware-policy; a package should
    # declare what it imports rather than rely on a dependency's dependency.
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
vmware-debug = "vmware_debug.cli:app"
vmware-debug-mcp = "vmware_debug.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["vmware_debug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "capability: Capability evals — scored trends, not pass/fail gates. Excluded from the default run (they measure quality, so <100% is expected and must not read as a broken build). Run them with: pytest -m capability",
]
addopts = "-m 'not capability'"

[project.urls]
Homepage = "https://github.com/vmware-skills/VMware-Debug"
Repository = "https://github.com/vmware-skills/VMware-Debug"
Issues = "https://github.com/vmware-skills/VMware-Debug/issues"
Changelog = "https://github.com/vmware-skills/VMware-Debug/blob/main/RELEASE_NOTES.md"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
